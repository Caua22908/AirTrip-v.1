services:
  database:
    image: postgres:16-alpine
    container_name: airtrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airtrip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    volumes:
      - airtrip-postgres-data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  airtrip-postgres-data: